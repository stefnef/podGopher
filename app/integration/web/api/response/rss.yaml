components:
  responses:
    rssResponse:
      description: "A show's rss feeds"
      content:
        application/rss+xml:
          schema:
            $ref: "#/components/schemas/rssResponseDto"
          examples:
            success:
              value:
                showTitle: "show title"
                distributionTitle: "distribution title"
                episodes:
                  - title: "episode title"

  schemas:
    rssResponseDto:
      type: object
      required:
        - showTitle
        - distributionTitle
        - episodes
      properties:
        id:
          $ref: "../model/distribution.yaml#/components/schemas/distributionSlug"
        title:
          $ref: "../model/distribution.yaml#/components/schemas/distributionTitle"
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/rssEpisodeDto"

    rssEpisodeDto:
      type: object
      required:
        - title
      properties:
        title:
          type: string