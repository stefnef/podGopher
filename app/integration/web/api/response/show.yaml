components:
  responses:
    showResponse:
      description: "A single show"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/showResponseDto"
          examples:
            success:
              value:
                id: "some-id"
                title: "Show Title"
                slug: "show-title"
                episodes:
                  - id: "episode-id"

    allShowResponse:
      description: "A list of all shows"
      content:
        application/json:
          schema:
            type: object
            required:
              - shows
            properties:
              shows:
                type: array
                items:
                  $ref: "#/components/schemas/allShowItemResponseDto"
          examples:
            success:
              value:
                shows:
                  - id: "show-id"
                    title: "show-title"

  schemas:
    showResponseDto:
      type: object
      required:
        - id
        - title
        - slug
        - episodes
        - distributions
      properties:
        id:
          $ref: "../model/show.yaml#/components/schemas/showId"
        title:
          $ref: "../model/show.yaml#/components/schemas/showTitle"
        slug:
          $ref: "../model/show.yaml#/components/schemas/showSlug"
        episodes:
          type: array
          items:
            $ref: "../model/episode.yaml#/components/schemas/episodeId"
        distributions:
          type: array
          items:
            $ref: "../model/distribution.yaml#/components/schemas/distributionId"

    allShowItemResponseDto:
      type: object
      required:
        - id
        - title
      properties:
        id:
          $ref: "../model/show.yaml#/components/schemas/showId"
        title:
          $ref: "../model/show.yaml#/components/schemas/showTitle"