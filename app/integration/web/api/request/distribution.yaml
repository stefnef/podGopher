components:
  requestBodies:
    distributionPostBody:
      required: true
      description: "Values of a newly created distribution"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/distributionPostDto"
          examples:
            success:
              value:
                title: "New Distribution"
                slug: "new-distribution"

    distributionUpdateBody:
      required: true
      description: "Values of an updated distribution"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/distributionUpdateDto"
          examples:
            success:
              value:
                title: "New Distribution"
                slug: "new-distribution"
                episodes:
                  - "episode-id"

  schemas:
    distributionPostDto:
      type: object
      required:
        - title
        - slug
      properties:
        title:
          $ref: "../model/distribution.yaml#/components/schemas/distributionTitle"
        slug:
          $ref: "../model/distribution.yaml#/components/schemas/distributionSlug"

    distributionUpdateDto:
      type: object
      required:
        - title
        - slug
        - episodes
      properties:
        title:
          $ref: "../model/distribution.yaml#/components/schemas/distributionTitle"
        slug:
          $ref: "../model/distribution.yaml#/components/schemas/distributionSlug"
        episodes:
          type: array
          items:
            $ref: "../model/episode.yaml#/components/schemas/episodeId"